# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build the Windows
# installer and publish it as a GitHub release for that tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # v1.2.3 -> 1.2.3, so the installer and the app carry the tag's version.
      - name: Read version from tag
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --config "{\"version\":\"${{ steps.version.outputs.number }}\"}"

      - uses: softprops/action-gh-release@v2
        with:
          name: Mimic ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.0.0-beta.1 is marked as a pre-release
          files: app/src-tauri/target/release/bundle/nsis/*.exe

  # .deb, .rpm and AppImage. Arch users can build from packaging/arch/PKGBUILD instead.
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version from tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,rpm,appimage --config "{\"version\":\"${{ steps.version.outputs.number }}\"}"

      - uses: softprops/action-gh-release@v2
        with:
          name: Mimic ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
