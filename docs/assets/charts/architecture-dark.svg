<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="How Mimic works" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How Mimic works</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7C7F"/></marker></defs>
<rect width="880" height="470" rx="16" fill="#111213"/>
<rect x="32" y="32" width="816" height="76" rx="10" fill="#202124" stroke="#2A2B2F" stroke-width="1"/>
<text x="48" y="60" font-size="15" font-weight="600" fill="#ECEDE9">Interface</text>
<text x="48" y="84" font-size="13" fill="#A9ABA6">The window you use: script, voice profiles, takes, settings. HTML, CSS and JavaScript in the system web view.</text>
<line x1="440" y1="108" x2="440" y2="146" stroke="#7A7C7F" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="448.0" y="131.0" font-size="12" fill="#7A7C7F">Tauri commands and events</text>
<rect x="32" y="146" width="816" height="120" rx="10" fill="#202124" stroke="#FF4733" stroke-width="1.5"/>
<text x="48" y="174" font-size="15" font-weight="600" fill="#ECEDE9">Rust core (Tauri 2)</text>
<text x="48" y="198" font-size="13" fill="#A9ABA6">Engine manager: one engine in memory at a time, idle unload, cancel.</text>
<text x="48" y="218" font-size="13" fill="#A9ABA6">Installer: an isolated Python environment per engine, PyTorch for your GPU or CPU.</text>
<text x="48" y="238" font-size="13" fill="#A9ABA6">Hardware and memory readout, profiles, saving takes, Caelestia colors.</text>
<line x1="250" y1="266" x2="250" y2="304" stroke="#7A7C7F" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="258.0" y="289.0" font-size="12" fill="#7A7C7F">JSON lines over stdin/stdout</text>
<line x1="690" y1="266" x2="690" y2="304" stroke="#7A7C7F" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="698.0" y="289.0" font-size="12" fill="#7A7C7F">HTTP</text>
<rect x="32" y="304" width="470" height="104" rx="10" fill="#202124" stroke="#2A2B2F" stroke-width="1"/>
<text x="48" y="332" font-size="15" font-weight="600" fill="#ECEDE9">Python workers (one venv each)</text>
<text x="48" y="356" font-size="13" fill="#A9ABA6">KittenTTS 2 · Breeze TTS 2 · Qwen3-TTS · NeuTTS Air</text>
<text x="48" y="376" font-size="13" fill="#A9ABA6">Speech-to-text (faster-whisper, CPU)</text>
<rect x="534" y="304" width="314" height="104" rx="10" fill="#202124" stroke="#2A2B2F" stroke-width="1"/>
<text x="550" y="332" font-size="15" font-weight="600" fill="#ECEDE9">Fish S2 Pro</text>
<text x="550" y="356" font-size="13" fill="#A9ABA6">vLLM-Omni server in WSL</text>
<text x="550" y="376" font-size="13" fill="#A9ABA6">(Windows + NVIDIA)</text>
<text x="440" y="446" font-size="13" fill="#7A7C7F" text-anchor="middle">Models run on an NVIDIA GPU (CUDA), an Intel Arc GPU (XPU) or the CPU. Nothing leaves the computer.</text>
</svg>